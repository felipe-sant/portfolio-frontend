name: Changeset

on:
    pull_request:
        branches: [staging]

permissions:
    contents: read

concurrency:
    group: changeset-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changeset:
        name: Changeset
        if: github.head_ref != 'changeset-release/staging' && github.head_ref != 'main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Check changeset
              run: npx changeset status --since=origin/staging
