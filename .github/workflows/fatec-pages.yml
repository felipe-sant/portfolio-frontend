name: Fatec Pages

on:
    workflow_call:
        inputs:
            tag:
                type: string
                required: false
                default: ""
        secrets:
            FATEC_PAGES_TOKEN:
                required: false
        outputs:
            is-release:
                description: "true quando a tag informada é v1.x.y"
                value: ${{ jobs.build.outputs.is-release }}
    workflow_dispatch:
        inputs:
            tag:
                type: string
                required: false
                default: ""

permissions:
    contents: read

concurrency:
    group: fatec-pages-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    build:
        name: Build Fatec
        runs-on: ubuntu-latest
        outputs:
            is-release: ${{ steps.mode.outputs.is-release }}
        steps:
            - name: Classify tag
              id: mode
              env:
                  TAG: ${{ inputs.tag }}
                  RUN_REF: ${{ github.ref }}
              run: |
                  if [[ "$TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
                      echo "is-release=true" >> "$GITHUB_OUTPUT"
                      echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
                  else
                      echo "is-release=false" >> "$GITHUB_OUTPUT"
                      echo "ref=$RUN_REF" >> "$GITHUB_OUTPUT"
                  fi
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.mode.outputs.ref }}
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Build
              env:
                  VITE_SITE_URL: https://felipe-sant.vercel.app
              run: npm run build
            - name: Lint
              run: npm run lint
            - name: Install Chromium
              run: npm run playwright:install
            - name: Test
              run: npm run test:cov
            - name: Build Fatec
              run: npm run build:fatec
            - name: Check contact form is absent
              run: npm run check:contact-form dist
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: fatec-pages
                  path: dist/
                  include-hidden-files: true
                  if-no-files-found: error

    publish:
        name: Publish to Fatec
        needs: build
        if: needs.build.outputs.is-release == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: fatec-publish
            cancel-in-progress: false
        steps:
            - name: Check tag is on main
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ inputs.tag }}
              run: |
                  status=$(gh api "repos/$REPOSITORY/compare/$TAG...main" --jq .status)
                  if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
                      echo "A tag $TAG não está na main (status: $status)"
                      exit 1
                  fi
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  persist-credentials: false
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Download artifact
              uses: actions/download-artifact@v7
              with:
                  name: fatec-pages
                  path: fatec-artifact
            - name: Checkout Fatec repository
              uses: actions/checkout@v7
              with:
                  repository: fatec-jacarei-dsm-portfolio/ra2581392423047
                  ref: main
                  token: ${{ secrets.FATEC_PAGES_TOKEN }}
                  path: fatec-repository
                  fetch-depth: 1
            - name: Replace docs
              run: npm run publish:fatec:docs -- fatec-artifact fatec-repository
            - name: Commit and push
              working-directory: fatec-repository
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add --all docs
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "Nada a publicar"
                      exit 0
                  fi
                  git commit -m "Publica a $TAG do portfólio"
                  git push origin main
