name: Version

on:
    push:
        branches: [staging]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: version-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        name: Version PR
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Create or update version PR
              uses: changesets/action@v2
              with:
                  version-script: npm run changeset:version
                  commit-message: "Chore :see_no_evil: Atualiza versão e CHANGELOG"
                  pr-title: "Chore :see_no_evil: Atualiza versão e CHANGELOG"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
