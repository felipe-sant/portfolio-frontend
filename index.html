<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            (function () {
                try {
                    var base = "%BASE_URL%";
                    if (location.pathname !== base) {
                        return;
                    }
                    var languageByPrimarySubtag = { pt: "pt-BR", en: "en", es: "es" };
                    var codes = [];
                    try {
                        codes.push(localStorage.getItem("portfolio-frontend:language"));
                    } catch (error) {}
                    var browserLanguages = navigator.languages || [];
                    for (var index = 0; index < browserLanguages.length; index++) {
                        codes.push(browserLanguages[index]);
                    }
                    codes.push(navigator.language);
                    var language = "en";
                    for (var position = 0; position < codes.length; position++) {
                        if (!codes[position]) {
                            continue;
                        }
                        var primarySubtag = String(codes[position]).toLowerCase().split("-")[0];
                        if (
                            Object.prototype.hasOwnProperty.call(
                                languageByPrimarySubtag,
                                primarySubtag
                            )
                        ) {
                            language = languageByPrimarySubtag[primarySubtag];
                            break;
                        }
                    }
                    location.replace(base + language + location.search + location.hash);
                } catch (error) {}
            })();
        </script>
        <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
        <script>
            (function () {
                try {
                    var theme = "light";
                    var saved = null;
                    try {
                        saved = localStorage.getItem("portfolio-frontend:theme");
                    } catch (error) {}
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else {
                        try {
                            if (matchMedia("(prefers-color-scheme: dark)").matches) {
                                theme = "dark";
                            }
                        } catch (error) {}
                    }
                    var color = theme === "dark" ? "#141210" : "#fbf9f5";
                    document.documentElement.setAttribute("data-theme", theme);
                    var metas = document.querySelectorAll('meta[name="theme-color"]');
                    for (var index = 0; index < metas.length; index++) {
                        metas[index].removeAttribute("media");
                        metas[index].setAttribute("content", color);
                    }
                } catch (error) {}
            })();
        </script>
        <script>
            (function () {
                try {
                    var motion = "full";
                    var saved = null;
                    try {
                        saved = localStorage.getItem("portfolio-frontend:motion");
                    } catch (error) {}
                    if (saved === "full" || saved === "reduced") {
                        motion = saved;
                    } else {
                        try {
                            if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
                                motion = "reduced";
                            }
                        } catch (error) {}
                    }
                    document.documentElement.setAttribute("data-motion", motion);
                } catch (error) {}
            })();
        </script>
        <meta
            name="description"
            content="Portfólio de Luiz Felipe dos Santos, desenvolvedor full stack em TypeScript: projetos, trajetória e contato."
        />
        <title>Luiz Felipe dos Santos · Desenvolvedor full stack</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
            crossorigin
        />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/bricolage-grotesque-latin-opsz-normal.woff2"
            crossorigin
        />
    </head>
    <body>

            >Busca, filtros, troca de idioma e de tema precisam de JavaScript. O conteúdo desta
            página está disponível sem ele.</noscript
        >
        <div id="root"></div>
        <script type="module" src="/src/entry-client.tsx"></script>
    </body>
</html>
