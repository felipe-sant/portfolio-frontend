<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="border-top:2px solid transparent;border-image:linear-gradient(90deg,#FFCC00,#F19100) 1;background:var(--surface-chrome);font-family:var(--font-body)">
<div style="max-width:80rem;margin:0 auto;padding:clamp(2rem,4vw,3rem) clamp(1rem,4vw,3rem) 1.5rem">

<sc-if value="{{ padrao }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex-wrap:wrap">
<div style="flex:1 1 16rem">
<div style="font:500 0.75rem var(--font-mono);letter-spacing:.1em;color:var(--text-label);margin-bottom:0.75rem">CONTATO</div>
<div style="font:700 1.5rem/1.2 var(--font-heading);letter-spacing:-.02em;color:var(--text-strong);max-width:18rem">Disponível para novos projetos</div>
<div style="font:400 0.875rem/1.7 var(--font-body);color:var(--text-weak);margin-top:0.75rem">São José dos Campos · SP<br>luiz@email.com</div>
</div>
<div style="display:flex;flex-direction:column;gap:1rem;flex:0 1 auto">
<div style="display:flex;gap:0.625rem;flex-wrap:wrap">
<a href="prototipo-contato.dc.html" style="display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.25rem;font:600 0.875rem var(--font-body);color:#202020;background:linear-gradient(180deg,#FFCC00,#F19100);border-radius:0.3rem;text-decoration:none">Enviar mensagem</a>
<button type="button" onClick="{{ copiar }}" style="display:inline-flex;align-items:center;gap:0.5rem;min-height:2.75rem;padding:0 1.25rem;font:600 0.875rem var(--font-body);color:var(--text-strong);background:transparent;border:1px solid var(--border-strong);border-radius:0.3rem;cursor:pointer" style-hover="border-color:var(--text-strong)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="14" height="14" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>{{ copiarLabel }}</button>
</div>
<div style="display:flex;gap:0.25rem">
<a href="#" aria-label="GitHub" style="display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;color:var(--text-label)" style-hover="color:var(--text-strong)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4M9 18c-4.51 2-5-2-7-2"></path></svg></a>
<a href="#" aria-label="LinkedIn" style="display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;color:var(--text-label)" style-hover="color:var(--text-strong)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg></a>
<a href="mailto:luiz@email.com" aria-label="E-mail" style="display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;color:var(--text-label)" style-hover="color:var(--text-strong)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></a>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ nav }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:2rem">
<div>
<div style="font:500 0.75rem var(--font-mono);letter-spacing:.1em;color:var(--text-label);margin-bottom:0.5rem">NAVEGAÇÃO</div>
<nav aria-label="Rodapé" style="display:flex;flex-direction:column">
<a href="prototipo-inicio.dc.html" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">Início</a>
<a href="prototipo-projetos.dc.html" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">Projetos</a>
<a href="prototipo-informacoes.dc.html" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">Informações</a>
</nav>
</div>
<div>
<div style="font:500 0.75rem var(--font-mono);letter-spacing:.1em;color:var(--text-label);margin-bottom:0.5rem">REDES</div>
<div style="display:flex;flex-direction:column">
<a href="#" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">GitHub ↗</a>
<a href="#" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">LinkedIn ↗</a>
<a href="#" style="display:flex;align-items:center;min-height:2.75rem;font:500 0.9375rem var(--font-body);color:var(--text-body);text-decoration:none" style-hover="color:var(--text-strong)">Currículo em PDF ↓</a>
</div>
</div>
</div>
</sc-if>

<div style="border-top:1px solid var(--border-subtle);margin-top:2rem;padding-top:1rem;display:flex;justify-content:space-between;gap:0.5rem 1rem;flex-wrap:wrap;font:400 0.8125rem var(--font-body);color:var(--text-label)">
<span>© 2026 · Luiz Felipe dos Santos</span>
<span>Feito em TypeScript</span>
</div>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;320px&quot;},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;padrao&quot;,&quot;nav&quot;],&quot;default&quot;:&quot;padrao&quot;,&quot;tsType&quot;:&quot;\&quot;padrao\&quot; | \&quot;nav\&quot;&quot;}}">
class Component extends DCLogic {
  state = { copiado: false };
  copiar = () => {
    try { navigator.clipboard && navigator.clipboard.writeText("luiz@email.com").catch(() => {}); } catch (e) {}
    this.setState({ copiado: true });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ copiado: false }), 2200);
  };
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const nav = this.props.modo === "nav";
    return { padrao: !nav, nav, copiar: this.copiar, copiarLabel: this.state.copiado ? "E-mail copiado" : "Copiar e-mail" };
  }
}
</script>
</body>
</html>
