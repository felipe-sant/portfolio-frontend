<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;z-index:20;background:var(--surface-chrome);border-bottom:1px solid var(--border-chrome);font-family:var(--font-body)">
<div style="max-width:80rem;margin:0 auto;min-height:4rem;padding:0.5rem clamp(1rem,4vw,3rem);display:flex;justify-content:space-between;align-items:center;gap:1rem">
<a href="prototipo-inicio.dc.html" style="display:inline-flex;align-items:center;min-height:2.75rem;font:700 1rem var(--font-heading);letter-spacing:-.015em;color:var(--text-strong);white-space:nowrap;text-decoration:none">Luiz Felipe dos Santos</a>

<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:{{ gap }}">
<nav aria-label="Principal" style="display:flex;gap:{{ gap }}">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
<a href="{{ l.href }}" aria-current="{{ l.current }}" style="display:inline-flex;align-items:center;min-height:2.75rem;font-family:var(--font-body);font-size:0.875rem;font-weight:{{ l.peso }};color:{{ l.cor }};border-bottom:2px solid {{ l.linha }};text-decoration:none;white-space:nowrap">{{ l.rotulo }}</a>
</sc-for>
</nav>
<div role="group" aria-label="Idioma" style="display:flex;align-items:center">
<sc-for list="{{ idiomas }}" as="i" hint-placeholder-count="3">
<sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--text-label);font:400 0.75rem var(--font-mono)">·</span></sc-if>
<button type="button" aria-pressed="{{ i.ativo }}" onClick="{{ i.onClick }}" style="min-width:2rem;min-height:2.75rem;padding:0 0.25rem;background:transparent;border:none;cursor:pointer;font-family:var(--font-mono);font-size:0.75rem;font-weight:{{ i.peso }};color:{{ i.cor }}">{{ i.rotulo }}</button>
</sc-for>
</div>
<button type="button" aria-label="{{ temaLabel }}" aria-pressed="{{ escuro }}" onClick="{{ alternarTema }}" style="display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;padding:0;color:var(--text-body);background:transparent;border:1px solid var(--border-subtle);border-radius:0.3rem;cursor:pointer" style-hover="border-color:var(--text-strong);color:var(--text-strong)">{{ temaIcone }}</button>
</div>
</sc-if>

<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{ menuLabel }}" aria-expanded="{{ menuAberto }}" aria-controls="menu-mobile" onClick="{{ alternarMenu }}" style="display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;padding:0;color:var(--text-strong);background:transparent;border:1px solid var(--border-subtle);border-radius:0.3rem;cursor:pointer">
<sc-if value="{{ menuAberto }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></sc-if>
<sc-if value="{{ menuFechado }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></sc-if>
</button>
</sc-if>
</div>

<sc-if value="{{ painel }}" hint-placeholder-val="{{ false }}">
<div id="menu-mobile" role="dialog" aria-modal="true" aria-label="Menu" style="position:fixed;top:4rem;left:0;right:0;bottom:0;z-index:19;overflow-y:auto;background:var(--surface-chrome);border-top:1px solid var(--border-chrome);padding:0.5rem 16px 2rem;display:flex;flex-direction:column">
<nav aria-label="Principal" style="display:flex;flex-direction:column">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
<a href="{{ l.href }}" onClick="{{ fecharMenu }}" aria-current="{{ l.current }}" style="display:flex;align-items:center;min-height:3.25rem;padding-left:0.875rem;font-family:var(--font-heading);font-size:1.25rem;font-weight:{{ l.pesoMobile }};letter-spacing:-.015em;color:{{ l.cor }};border-left:2px solid {{ l.linha }};border-bottom:1px solid var(--border-subtle);text-decoration:none">{{ l.rotulo }}</a>
</sc-for>
</nav>
<div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:1rem">
<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
<span style="font:500 0.75rem var(--font-mono);letter-spacing:.08em;color:var(--text-label)">IDIOMA</span>
<div role="group" aria-label="Idioma" style="display:flex;gap:0.375rem">
<sc-for list="{{ idiomas }}" as="i" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ i.ativo }}" onClick="{{ i.onClick }}" style="min-width:2.75rem;min-height:2.75rem;padding:0 0.5rem;border-radius:0.3rem;cursor:pointer;font-family:var(--font-mono);font-size:0.8125rem;font-weight:{{ i.peso }};color:{{ i.cor }};background:{{ i.fundo }};border:1px solid {{ i.borda }}">{{ i.rotulo }}</button>
</sc-for>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
<span style="font:500 0.75rem var(--font-mono);letter-spacing:.08em;color:var(--text-label)">TEMA</span>
<button type="button" aria-pressed="{{ escuro }}" onClick="{{ alternarTema }}" style="display:inline-flex;align-items:center;gap:0.5rem;min-height:2.75rem;padding:0 1rem;font:600 0.875rem var(--font-body);color:var(--text-strong);background:transparent;border:1px solid var(--border-strong);border-radius:0.3rem;cursor:pointer">{{ temaIcone }}{{ temaTexto }}</button>
</div>
</div>
</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;ativo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Início&quot;,&quot;Projetos&quot;,&quot;Informações&quot;,&quot;Contato&quot;,&quot;&quot;],&quot;default&quot;:&quot;Início&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const h = React.createElement;
const LINKS = [
  ["Início", "prototipo-inicio.dc.html"],
  ["Projetos", "prototipo-projetos.dc.html"],
  ["Informações", "prototipo-informacoes.dc.html"],
  ["Contato", "prototipo-contato.dc.html"]
];
const IDIOMAS = ["PT", "EN", "ES"];

function temaInicial() {
  const q = new URLSearchParams(location.search).get("tema");
  if (q === "dark" || q === "light") return q;
  try { const s = localStorage.getItem("proto-tema"); if (s) return s; } catch (e) {}
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

class Component extends DCLogic {
  state = { w: window.innerWidth, menu: false, tema: temaInicial(), idioma: "PT" };

  aplicar(t) { document.documentElement.setAttribute("data-theme", t); }
  alternarTema = () => {
    const t = this.state.tema === "dark" ? "light" : "dark";
    try { localStorage.setItem("proto-tema", t); } catch (e) {}
    this.aplicar(t);
    this.setState({ tema: t });
  };
  alternarMenu = () => this.setState((s) => ({ menu: !s.menu }));
  fecharMenu = () => this.setState({ menu: false });
  onResize = () => this.setState({ w: window.innerWidth, menu: window.innerWidth < 640 ? this.state.menu : false });
  onKey = (e) => { if (e.key === "Escape" && this.state.menu) this.fecharMenu(); };

  componentDidMount() {
    this.aplicar(this.state.tema);
    window.addEventListener("resize", this.onResize);
    document.addEventListener("keydown", this.onKey);
  }
  componentDidUpdate() { document.body.style.overflow = this.state.menu ? "hidden" : ""; }
  componentWillUnmount() {
    window.removeEventListener("resize", this.onResize);
    document.removeEventListener("keydown", this.onKey);
    document.body.style.overflow = "";
  }

  icone() {
    const dark = this.state.tema === "dark";
    const kids = dark
      ? [h("circle", { key: 1, cx: 12, cy: 12, r: 4 }), h("path", { key: 2, d: "M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" })]
      : [h("path", { key: 1, d: "M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" })];
    return h("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true }, kids);
  }

  renderVals() {
    const { w, menu, tema, idioma } = this.state;
    const ativo = this.props.ativo;
    const desktop = w >= 640;
    const escuro = tema === "dark";
    return {
      desktop, mobile: !desktop,
      painel: !desktop && menu,
      menuAberto: menu, menuFechado: !menu,
      menuLabel: menu ? "Fechar menu" : "Abrir menu",
      alternarMenu: this.alternarMenu, fecharMenu: this.fecharMenu,
      gap: w < 960 ? "0.75rem" : "1.5rem",
      links: LINKS.map(([rotulo, href]) => {
        const on = rotulo === ativo;
        return { rotulo, href, current: on ? "page" : undefined, peso: on ? 600 : 500, pesoMobile: on ? 800 : 600,
          cor: on ? "var(--text-strong)" : "var(--text-body)", linha: on ? "var(--brand-variant)" : "transparent" };
      }),
      idiomas: IDIOMAS.map((rotulo, i) => {
        const on = rotulo === idioma;
        return { rotulo, sep: i > 0, ativo: on, peso: on ? 600 : 400,
          cor: on ? "var(--text-strong)" : "var(--text-label)",
          fundo: on ? "var(--bg-highlight)" : "transparent",
          borda: on ? "var(--brand-variant)" : "var(--border-subtle)",
          onClick: () => this.setState({ idioma: rotulo }) };
      }),
      escuro,
      temaLabel: escuro ? "Usar tema claro" : "Usar tema escuro",
      temaTexto: escuro ? "Tema claro" : "Tema escuro",
      temaIcone: this.icone(),
      alternarTema: this.alternarTema
    };
  }
}
</script>
</body>
</html>
